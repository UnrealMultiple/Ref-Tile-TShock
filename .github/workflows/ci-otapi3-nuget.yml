name: Deploy NuGet (Ref-Tile-TShock)

on:
  push:
    branches: [ nuget-release ]
  workflow_dispatch: # 允许手动触发，方便测试

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # 必需：让 GitHub Actions 签发 OIDC 令牌，用于 NuGet 可信发布

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build TShock.sln --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release

    # 可信发布：用 OIDC 令牌在 nuget.org 换取临时 API 密钥（有效期 1 小时），无需长期密钥
    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }} # nuget.org 用户名（个人资料名，如 Controllerdestiny）

    - name: Push Ref-Tile-TShock
      run: dotnet nuget push TShockAPI/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
